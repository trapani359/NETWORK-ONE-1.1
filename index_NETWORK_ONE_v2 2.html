<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Network One</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f5f7fb;color:#172033}header{background:#111827;color:#fff;padding:18px;display:flex;justify-content:space-between}.gps{background:#22c55e;padding:6px 10px;border-radius:18px;font-weight:700}main{max-width:760px;margin:auto;padding:18px 16px 90px}.card,.target{background:#fff;border:1px solid #e1e6ef;border-radius:18px;padding:16px;margin:14px 0}.target{padding:15px}.hidden{display:none}button,a{border:0;border-radius:13px;padding:13px;font-weight:800;text-decoration:none;display:inline-block}button{cursor:pointer}.primary{background:#111827;color:#fff;width:100%}.back{background:#e5e7eb;width:100%;margin-bottom:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.actions a{background:#eef2ff;color:#1d4ed8;text-align:center}.badge{display:inline-block;background:#dcfce7;color:#166534;padding:5px 9px;border-radius:10px;font-size:12px;font-weight:800;margin-top:7px}.muted{color:#667085}.photo{height:120px;background:#eef2f7;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center}.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px;z-index:5}nav button{background:#fff;color:#667085}
</style></head><body><header><b>📍 NETWORK ONE</b><span class="gps">🟢 GPS ATTIVO</span></header><main>
<section id="home"><h1>Home</h1><div class="card"><h2>🔥 Giro consigliato</h2><p class="muted">Trova e ordina i migliori target.</p><button class="primary" onclick="route()">🚗 APRI GIRO CONSIGLIATO</button></div><div class="card">📍 GPS: <b>attivo</b><br>🎯 Target disponibili: <b>5</b></div></section>
<section id="radar" class="hidden"><button class="back" onclick="show('home')">← Home</button><h1>🗺️ Radar</h1><div class="card"><h2>🔥 TOP TARGET</h2><div id="targets"></div></div></section>
<section id="route" class="hidden"><button class="back" onclick="show('home')">← Home</button><h1>🚗 Giro consigliato</h1><div id="routeList"></div></section>
<section id="profile" class="hidden"><button class="back" onclick="show('radar')">← Radar</button><div id="profile"></div></section>
<section id="report" class="hidden"><h1>📊 Report</h1><div class="card">Target totali: <b>5</b><br><br>Target consigliati: <b>3</b><br><br>GPS: <b>ATTIVO</b></div></section>
</main><nav><button onclick="show('home')">🏠<br>Home</button><button onclick="radar()">🗺️<br>Radar</button><button onclick="show('report')">📊<br>Report</button></nav>
<script>
const t=[["Tabaccheria Grimaudo","Trapani",2.4,91],["Tabaccheria Europa","Trapani",3.1,88],["Il Tabacco Croce Pietro","Trapani",4.2,86],["Torre Adelaide","Trapani",5.6,84],["Bar Tabacchi Centrale","Trapani",6.3,81]];
function show(id){document.querySelectorAll("main>section").forEach(x=>x.classList.add("hidden"));document.getElementById(id).classList.remove("hidden");scrollTo(0,0)}
function card(i){let x=t[i];return `<div class="target"><b>${x[0]}</b><br><span class="muted">📍 ${x[1]} · 📏 ${x[2]} km · ⭐ ${x[3]}/100</span><br><span class="badge">🔥 TARGET</span><div class="actions"><a href="#" onclick="no('telefono')">📞 Telefono</a><a href="#" onclick="no('WhatsApp')">💬 WhatsApp</a><a href="#" onclick="no('e-mail')">✉️ E-mail</a><a href="#" onclick="no('sito web')">🌐 Sito</a></div><button class="primary" style="margin-top:9px" onclick="profile(${i})">👤 SCHEDA COMPLETA</button></div>`}
function no(x){alert(x+" non disponibile per questo target.");return false}
function radar(){document.getElementById("targets").innerHTML=t.map((_,i)=>card(i)).join("");show("radar")}
function route(){document.getElementById("routeList").innerHTML=[...t].map((x,i)=>({x,i})).sort((a,b)=>a.x[2]-b.x[2]).map((z,n)=>`<div class="card"><b>${n+1}. ${z.x[0]}</b><br>📏 ${z.x[2]} km · ⭐ ${z.x[3]}/100<br><button onclick="profile(${z.i})">👤 Scheda target</button></div>`).join("");show("route")}
function profile(i){let x=t[i];document.getElementById("profile").innerHTML=`<h1>🏪 ${x[0]}</h1><div class="card"><b>📍 Indirizzo:</b> ${x[1]}<br><br>📏 ${x[2]} km · ⭐ ${x[3]}/100</div><div class="card"><h2>📞 Contatti</h2><div class="actions"><a href="#" onclick="no('telefono')">📞 Telefono</a><a href="#" onclick="no('WhatsApp')">💬 WhatsApp</a><a href="#" onclick="no('e-mail')">✉️ E-mail</a><a href="#" onclick="no('sito web')">🌐 Sito</a></div></div><div class="card"><h2>📸 Foto</h2><div class="photos"><div class="photo">📷 Foto esterna<br>da fonte pubblica</div><div class="photo">🏠 Foto interna<br>da fonte pubblica</div></div><p class="muted">I dati reali verranno mostrati solo quando disponibili da fonti pubbliche verificabili.</p></div>`;show("profile")}
</script></body></html>
